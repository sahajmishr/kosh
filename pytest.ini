[pytest]
# Belt and braces so `import kosh` always resolves:
#   pythonpath = .          -> pytest >= 7 puts rootdir on sys.path
#   conftest.py at root     -> works on every pytest version
#   tests/__init__.py       -> makes tests a package, hoisting the path too
pythonpath = .
testpaths = tests

# asyncio_mode = auto lets us write `async def test_...` without decorating
# every single one with @pytest.mark.asyncio.
asyncio_mode = auto

# Set explicitly to silence the pytest-asyncio deprecation warning and to
# pin behaviour across future versions.
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function